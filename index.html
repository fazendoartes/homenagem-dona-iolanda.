<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#dbeaf0"><title>Para Dona Iolanda — Com carinho, Fê</title><style>
:root{--ink:#284454;--soft:#617782;--gold:#ad8c64}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(circle at 15% 10%,#fffdf6,transparent 40%),linear-gradient(145deg,#d8eaf0,#f7f4ec 58%,#d5e7ef);color:var(--ink);font-family:Georgia,'Times New Roman',serif;display:flex;align-items:center;justify-content:center;padding:22px 14px}.shell{width:min(100%,510px);min-height: min(690px,90svh);border:1px solid #ffffffb8;border-radius:28px;background:#fffcf7df;box-shadow:0 20px 70px #5371832b;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:35px 27px 28px;text-align:center}.shell:before,.shell:after{content:'✦';position:absolute;color:#b7cbd0;opacity:.55;font-size:70px}.shell:before{top:-18px;left:15px}.shell:after{bottom:-23px;right:15px}.eyebrow{font:600 11px/1.5 Arial,sans-serif;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin:0 0 16px}.heart{color:#b48c8a;font-size:27px;margin-bottom:8px}.title{font-size:clamp(28px,7vw,39px);line-height:1.22;font-weight:normal;margin:0 0 18px}.copy{font-size:clamp(17px,4.3vw,20px);line-height:1.75;white-space:pre-line;margin:0 auto 20px;max-width:410px}.photo{width:100%;max-height:345px;object-fit:contain;border-radius:14px;box-shadow:0 9px 24px #2643521f;margin:5px auto 17px}.signature{font-size:20px;font-style:italic;color:#8b6e66;margin-top:14px}.controls{margin-top:16px;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}.btn{background:#426d80;border:0;border-radius:100px;color:white;padding:15px 26px;font:600 14px Arial,sans-serif;cursor:pointer;min-height:48px}.btn.secondary{background:transparent;color:#426d80;border:1px solid #9bb4be}.music-controls{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:9px;margin:17px 0 3px}.music-btn{background:#f0e7db;border:1px solid #c9b8a4;border-radius:100px;color:#496474;padding:12px 18px;font:600 13px Arial,sans-serif;cursor:pointer;min-height:46px}.music-note{font:12px Arial,sans-serif;color:#617782;margin:7px 0 0}.dots{display:flex;gap:7px;justify-content:center;margin:18px 0 0}.dot{width:6px;height:6px;background:#c6d5d9;border-radius:50%}.dot.active{background:#9b7c5b;width:18px;border-radius:8px}.foot{font:12px Arial,sans-serif;color:#78909b;margin-top:15px}.fade{animation:fade .45s ease both}@keyframes fade{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}@media(max-height:650px){.shell{padding:23px 20px;min-height:0}.copy{font-size:17px;line-height:1.5}.photo{max-height:250px}}
</style></head><body><main class="shell"><div id="content" class="fade" aria-live="polite"></div><div class="music-controls"><button type="button" id="musicToggle" class="music-btn" aria-pressed="false">♫ Ouvir nossa homenagem ▶</button></div><p id="musicStatus" class="music-note" aria-live="polite">O Amor Que Ficou Aqui · Uma canção especial</p><audio id="tributeAudio" preload="none" src="o-amor-que-ficou-aqui.mp3"></audio><div class="controls"><button id="back" class="btn secondary" hidden>Voltar</button><button id="next" class="btn">Abrir homenagem ♡</button></div><div class="dots" id="dots" aria-hidden="true"></div><div class="foot" id="foot">Feito com amor, especialmente para você</div></main><script>
const pages=[
{tag:'Uma homenagem especial',title:'Para Dona Iolanda',body:'Existem histórias de amor que o tempo jamais apaga.\n\nPreparei estas palavras com muito carinho, para lembrar que você é amada e que não está sozinha.'},
{tag:'01 · Um amor que permanece',title:'O amor deixa raízes',body:'Existem pessoas que passam pela nossa vida e deixam lembranças. E existem aquelas que se tornam parte de quem somos.\n\nO Sr. João será sempre parte da sua história, da sua vida e do seu coração.'},
{tag:'02 · Tudo o que viveram',title:'Uma história só de vocês',body:'Uma vida compartilhada não cabe em palavras.\n\nSão momentos, conversas, alegrias, dificuldades superadas e pequenas lembranças que só vocês dois conhecem.\n\nNada disso se perde, porque o amor que construíram permanece.'},
{tag:'03 · Sobre a saudade',title:'Você não precisa ser forte o tempo todo',body:'Sei que estes dias não têm sido fáceis e que nenhuma palavra consegue preencher a ausência de alguém tão amado.\n\nVocê pode chorar, sentir saudade, lembrar e falar dele quantas vezes quiser. Cada sentimento tem seu tempo.'},
{tag:'04 · Meu carinho por você',title:'Eu estou aqui',body:'Talvez eu não encontre as palavras certas em todos os momentos, mas quero estar presente.\n\nPara te ouvir, te abraçar, compartilhar as lembranças e, quando chegar a hora, voltar a sorrir junto com você.\n\nVocê não está sozinha.'},
{tag:'05 · Uma lembrança preciosa',title:'Um amor que permanece',photo:true,body:'Uma fotografia não consegue contar toda uma história. Mas pode guardar um abraço, um gesto de carinho e um instante que ficará para sempre.\n\nO amor que você e o Sr. João construíram continua vivo nas lembranças.'},
{tag:'06 · Um presente com carinho',title:'Um pequeno abraço para levar com você',body:'Escolhi este colar com muito carinho.\n\nNão para representar a ausência do Sr. João, mas para lembrar que existem laços que nem o tempo, nem a distância e nem a despedida conseguem desfazer.\n\nQue ele seja um pequeno abraço nos dias em que a saudade apertar.'},
{tag:'Com todo o meu amor e carinho',title:'Você é muito amada, Dona Iolanda',body:'Que as lembranças tragam conforto e que o carinho da família te acolha, um dia de cada vez.\n\nO amor não desaparece. Ele encontra novas maneiras de permanecer.',signature:'Sua nora, Fê ♡'}
];let current=0;const content=document.getElementById('content'),back=document.getElementById('back'),next=document.getElementById('next'),dots=document.getElementById('dots');function render(){const p=pages[current];content.classList.remove('fade');void content.offsetWidth;content.classList.add('fade');content.replaceChildren();const heart=document.createElement('div');heart.className='heart';heart.textContent='♡';content.append(heart);const tag=document.createElement('p');tag.className='eyebrow';tag.textContent=p.tag;content.append(tag);const title=document.createElement('h1');title.className='title';title.textContent=p.title;content.append(title);if(p.photo){const img=document.createElement('img');img.src='foto.jpg';img.alt='Dona Iolanda e Sr. João juntos em uma paisagem à beira-mar';img.className='photo';content.append(img)}const body=document.createElement('p');body.className='copy';body.textContent=p.body;content.append(body);if(p.signature){const sig=document.createElement('div');sig.className='signature';sig.textContent=p.signature;content.append(sig)}back.hidden=current===0;next.textContent=current===0?'Abrir homenagem ♡':current===pages.length-1?'Recomeçar ♡':'Continuar ♡';dots.replaceChildren();pages.forEach((_,i)=>{const d=document.createElement('span');d.className='dot'+(i===current?' active':'');dots.append(d)});document.getElementById('foot').textContent=`${current+1} de ${pages.length} · Feito com carinho`;}back.addEventListener('click',()=>{if(current>0){current--;render()}});next.addEventListener('click',()=>{current=(current+1)%pages.length;render()});render();
const tributeAudio=document.getElementById('tributeAudio');
const musicToggle=document.getElementById('musicToggle');
const musicStatus=document.getElementById('musicStatus');
function updateMusic(){const playing=!tributeAudio.paused;musicToggle.textContent=playing?'Ⅱ Pausar homenagem':'♫ Ouvir nossa homenagem ▶';musicToggle.setAttribute('aria-pressed',String(playing));musicStatus.textContent=playing?'♫ O Amor Que Ficou Aqui · Tocando':'O Amor Que Ficou Aqui · Uma canção especial';}
musicToggle.addEventListener('click',async()=>{if(tributeAudio.paused){try{await tributeAudio.play()}catch(e){musicStatus.textContent='Não foi possível reproduzir. Verifique se o arquivo MP3 foi enviado junto ao cartão.'}}else{tributeAudio.pause()}updateMusic()});
tributeAudio.addEventListener('play',updateMusic);tributeAudio.addEventListener('pause',updateMusic);
tributeAudio.addEventListener('ended',updateMusic);
</script></body></html>
